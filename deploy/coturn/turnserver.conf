# Coturn TURN/STUN server configuration for Track 3 screen-sharing relay.
# Used when direct WebRTC peer connections cannot traverse symmetric NAT or firewalls.
# Ephemeral credentials (REST API / HMAC-SHA1) are issued by the backend with short expiry.

# Listening ports
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

# Fingerprint in all STUN/TURN messages
fingerprint

# Authentication: time-limited ephemeral credentials using a shared secret.
# Credentials are generated by the server with format: username = <timestamp>:<learner_id>,
# password = HMAC-SHA1(username, static-auth-secret).
use-auth-secret
# The static-auth-secret is injected at runtime via environment variable or command-line flag.
# Never commit a static secret in this file.

# Realm: identifies the TURN domain (matches TURN_REALM environment variable).
realm=track3.local

# Security and anti-abuse controls:
# Disable CLI management port to reduce attack surface.
no-cli
# Disallow relaying to multicast addresses.
no-multicast-peers

# SSRF and internal network protection:
# Strictly deny relaying packets to private, loopback, or cloud-metadata destinations.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# IPv6 private/link-local ranges
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Logging: log connection events without leaking media content or tokens.
verbose
no-stdout-log
