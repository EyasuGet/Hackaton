# One-command demo stack for judges and external evaluators (T3-043).
# Starts PostgreSQL -> one-shot migrations + seed + course/jobs import + demo links -> API -> Web.
# Run with:
#   docker compose -f compose.demo.yaml up
# Or:
#   docker compose --profile demo up

services:
  db:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-track3}
      POSTGRES_USER: ${DATABASE_USER:-track3}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-demo-password}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - demo_db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - demo_net

  seed:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ['node', 'apps/api/src/demo-seed-all.ts']
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-track3}
      DATABASE_USER: ${DATABASE_USER:-track3}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-demo-password}
      DEMO_MODE: 'true'
      DEMO_ALLOWED_ORIGINS: 'http://localhost:5173,http://127.0.0.1:5173'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - demo_net
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-track3}
      DATABASE_USER: ${DATABASE_USER:-track3}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-demo-password}
      DEMO_MODE: 'true'
      DEMO_ALLOWED_ORIGINS: 'http://localhost:5173,http://127.0.0.1:5173'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/ready || exit 1']
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - demo_net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - '127.0.0.1:5173:5173'
    environment:
      API_HOST: api
      API_PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - demo_net

networks:
  demo_net:
    driver: bridge

volumes:
  demo_db_data:
